# Render blueprint for the free-check background worker (src/free_check_worker.py).
# It makes paid AI provider calls. The secrets below are entered in the Render dashboard and are
# never stored in this repository. The Streamlit app is deployed separately and is not affected.
services:
  - type: worker
    name: free-check-worker
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.free_check_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FREE_CHECK_DAILY_CAP
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
